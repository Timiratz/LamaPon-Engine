name: Release

# v0.1.0 のようなタグをプッシュすると、ビルド・全テスト・
# パッケージングを行い、GitHub Releaseへ配布物を添付します。
on:
  push:
    tags:
      - "v*"

# 既定は読み取りだけにし、Release作成に要る書き込み権限は
# このジョブにだけ与えます。
permissions:
  contents: read

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 後続のビルドやテストへGITHUB_TOKENを残しません。
          persist-credentials: false

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Configure
        run: >
          cmake
          -S .
          -B build-release
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build-release --parallel

      # リリースは全テスト通過を必須にします。
      - name: Test
        run: ctest --test-dir build-release --output-on-failure --parallel 4

      - name: Build engine package
        run: cmake --build build-release --target package

      - name: Archive symbols
        shell: pwsh
        run: |
          Compress-Archive `
            -Path `
              build-release/LamaPonRuntime.pdb, `
              build-release/LamaPonEditor.pdb, `
              build-release/LamaPonHub.pdb, `
              build-release/LamaPonGame.pdb, `
              build-release/LamaPonGameModule.pdb, `
              build-release/generated/build-info.json `
            -DestinationPath build-release/LamaPon-symbols-windows-x64.zip

      # CHANGELOG.mdからこのバージョンの節を抜き出して
      # リリースノートにします。
      - name: Extract release notes
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $lines = Get-Content CHANGELOG.md
          $notes = New-Object System.Collections.Generic.List[string]
          $inSection = $false
          foreach ($line in $lines) {
            if ($line -match "^## ") {
              if ($inSection) { break }
              if ($line -match ("^## " + [regex]::Escape($version) + "( |$)")) {
                $inSection = $true
                continue
              }
            }
            elseif ($inSection) {
              $notes.Add($line)
            }
          }
          if ($notes.Count -eq 0) {
            $notes.Add("CHANGELOG.md を参照してください。")
          }
          $notes | Set-Content release-notes.md -Encoding utf8
          Get-Content release-notes.md

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ワイルドカードはsymbols zipにも一致して同名アセットの
          # 二重アップロードになるため、正確なファイル名を組み立てます。
          $version = "${{ github.ref_name }}".TrimStart("v")
          gh release create "${{ github.ref_name }}" `
            --title "LamaPon ${{ github.ref_name }}" `
            --notes-file release-notes.md `
            "build-release/LamaPon-$version-windows-x64.zip" `
            build-release/LamaPon-symbols-windows-x64.zip
